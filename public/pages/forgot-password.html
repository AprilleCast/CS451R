<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — BudgeIt</title>
  <script>(function(){const t=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",t);})();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon"><i class="fas fa-wallet"></i></div>
        <span class="auth-logo-text">BudgeIt</span>
      </div>
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>

      <div class="alert" id="alertMsg"></div>

      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="email" class="form-input" placeholder="you@example.com"/>
        </div>
        <span class="form-error" id="emailError"></span>
      </div>

      <button class="btn btn-primary" id="submitBtn">
        <i class="fas fa-paper-plane"></i> Send Reset Link
      </button>

      <hr class="divider"/>
      <p style="text-align:center;font-size:0.875rem;color:var(--text-secondary);">
        Remember your password? <a href="login.html" class="link">Sign in</a>
      </p>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    ThemeManager.init();

    document.getElementById("submitBtn").addEventListener("click", async () => {
      UI.clearFieldErrors();
      UI.hideAlert("alertMsg");

      const email = document.getElementById("email").value.trim();
      const btn   = document.getElementById("submitBtn");

      if (!email) { UI.showFieldError("email", "Email is required."); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { UI.showFieldError("email", "Invalid email."); return; }

      UI.setLoading(btn, true);
      try {
        const res = await API.post("/api/auth/forgot-password", { email });
        UI.showAlert("alertMsg", res.message, "success");
      } catch {
        UI.showAlert("alertMsg", "Something went wrong.", "error");
      } finally {
        UI.setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
