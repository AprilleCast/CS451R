<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — BudgeIt</title>
  <script>(function(){const t=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",t);})();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon"><i class="fas fa-wallet"></i></div>
        <span class="auth-logo-text">BudgeIt</span>
      </div>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your new password below</p>

      <div class="alert" id="alertMsg"></div>

      <!-- Invalid token message -->
      <div id="invalidToken" style="display:none;">
        <div class="alert alert-error show">
          <i class="fas fa-circle-xmark"></i> This reset link is invalid or has expired.
        </div>
        <p style="text-align:center;margin-top:1rem;">
          <a href="forgot-password.html" class="link">Request a new link</a>
        </p>
      </div>

      <div id="resetForm">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="newPassword" class="form-input" placeholder="Min 8 chars, 1 uppercase, 1 number"/>
            <button type="button" class="input-toggle" id="toggleNew"><i class="fas fa-eye"></i></button>
          </div>
          <span class="form-error" id="newPasswordError"></span>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter new password"/>
            <button type="button" class="input-toggle" id="toggleConfirm"><i class="fas fa-eye"></i></button>
          </div>
          <span class="form-error" id="confirmPasswordError"></span>
        </div>

        <button class="btn btn-primary" id="resetBtn">
          <i class="fas fa-lock"></i> Reset Password
        </button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    ThemeManager.init();

    const token = new URLSearchParams(window.location.search).get("token");
    if (!token) {
      document.getElementById("resetForm").style.display = "none";
      document.getElementById("invalidToken").style.display = "block";
    }

    // Password toggle
    document.getElementById("toggleNew").addEventListener("click", function() {
      const inp = document.getElementById("newPassword");
      const icon = this.querySelector("i");
      inp.type = inp.type === "password" ? "text" : "password";
      icon.className = inp.type === "password" ? "fas fa-eye" : "fas fa-eye-slash";
    });
    document.getElementById("toggleConfirm").addEventListener("click", function() {
      const inp = document.getElementById("confirmPassword");
      const icon = this.querySelector("i");
      inp.type = inp.type === "password" ? "text" : "password";
      icon.className = inp.type === "password" ? "fas fa-eye" : "fas fa-eye-slash";
    });

    document.getElementById("resetBtn").addEventListener("click", async () => {
      UI.clearFieldErrors();
      UI.hideAlert("alertMsg");

      const newPassword     = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const btn             = document.getElementById("resetBtn");

      let hasError = false;
      if (!newPassword)              { UI.showFieldError("newPassword", "Password is required.");         hasError = true; }
      else if (newPassword.length < 8)     { UI.showFieldError("newPassword", "Min 8 characters.");            hasError = true; }
      else if (!/[A-Z]/.test(newPassword)) { UI.showFieldError("newPassword", "Must contain uppercase.");      hasError = true; }
      else if (!/[0-9]/.test(newPassword)) { UI.showFieldError("newPassword", "Must contain a number.");       hasError = true; }
      if (newPassword !== confirmPassword) { UI.showFieldError("confirmPassword", "Passwords do not match."); hasError = true; }
      if (hasError) return;

      UI.setLoading(btn, true);
      try {
        const res = await API.post("/api/auth/reset-password", { token, newPassword });
        if (res.success) {
          UI.showAlert("alertMsg", "Password reset! Redirecting to login...", "success");
          setTimeout(() => window.location.href = "login.html", 2500);
        } else {
          UI.showAlert("alertMsg", res.message || "Reset failed.", "error");
        }
      } catch {
        UI.showAlert("alertMsg", "Something went wrong.", "error");
      } finally {
        UI.setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
